[package]
name = "oscar-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json"] }
base64 = "0.22"
sha2 = "0.10"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging"] }
