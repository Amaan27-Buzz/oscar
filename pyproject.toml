[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oscar-brain"
version = "0.1.0"
description = "OSCAR Club A evidence-backed runtime"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.12.12", "mypy==1.18.2"]
browser = ["playwright==1.63.0"]
memory = ["qdrant-client==1.19.1", "graphiti-core==0.30.2", "fastembed==0.8.1"]
memory-reference = ["sentence-transformers==6.1.0"]

[project.scripts]
oscar = "oscar.cli:main"

[tool.setuptools.packages.find]
include = ["oscar*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["oscar"]
