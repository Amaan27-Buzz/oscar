[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oscar-brain"
version = "0.1.0"
description = "OSCAR Club A evidence-backed runtime"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.12.12", "mypy==1.18.2"]
browser = ["playwright==1.63.0"]
mcp = ["mcp==2.3.0"]
memory = ["qdrant-client==1.19.1", "graphiti-core==0.30.2", "fastembed==0.8.1"]
memory-reference = ["sentence-transformers==6.1.0"]
voice = ["sherpa-onnx==1.13.8", "sounddevice==0.5.6", "numpy==2.5.3",
         "faster-whisper==1.2.1", "sentencepiece==0.2.1"]
voice-kokoro = ["kokoro-onnx==0.6.1"]
sunday = ["cryptography==50.0.2"]
mobile = ["cryptography==50.0.2"]
voice-benchmark = ["psutil==7.2.2"]
voice-piper = ["piper-tts==1.8.0"]

[project.scripts]
oscar = "oscar.cli:main"

[tool.setuptools.packages.find]
include = ["oscar*"]

[tool.setuptools.package-data]
oscar = ["*.ps1"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["oscar"]
