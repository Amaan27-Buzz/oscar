name: Brain contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  brain:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned developer checks
        run: python -m pip install '.[dev,mobile]'
      - name: Lint, format and type contracts
        run: |
          python -m ruff check oscar tests scripts
          python -m ruff format --check oscar tests scripts
          python -m mypy oscar
      - name: Offline contract and real loopback tests
        run: python -m unittest discover -s tests -t . -v
      - name: Offline repository and secret-safety checks
        run: python -m scripts.check_repository
