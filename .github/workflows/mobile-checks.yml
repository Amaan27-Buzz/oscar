name: OSCAR Mobile software
on:
  pull_request:
  push:
    branches: [main, work]
permissions:
  contents: read
jobs:
  core-boundary:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install '.[dev,mobile]'
      - run: python -m unittest tests.test_mobile -v
      - run: python -m scripts.mobile_reference
      - run: python -m mypy oscar scripts/build_mobile.py scripts/mobile_reference.py
  android-reference-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: python -m scripts.build_mobile
      - uses: actions/upload-artifact@v4
        with:
          name: oscar-mobile-reference-apk
          path: mobile/app/build/outputs/apk/**/*.apk
  android-emulated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          working-directory: mobile
          script: sh gradlew --no-daemon connectedDebugAndroidTest
