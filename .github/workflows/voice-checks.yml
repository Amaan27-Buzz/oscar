name: Voice reference contracts
on:
  pull_request:
  push:
    branches: [main, work]
permissions:
  contents: read
jobs:
  acoustic-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.5.3
      - name: Deterministic contracts and numeric playback reference
        run: python -m unittest tests.test_voice -v
      - name: Optional model/device distinction
        run: python -m unittest tests.test_voice_models -v
