name: Desktop Windows reference
on:
  pull_request:
  push:
    branches: [main, work]
permissions:
  contents: read
jobs:
  windows-reference:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,mobile]'
      - run: python -m unittest tests.test_desktop -v
      - run: python -m scripts.desktop_reference --self-check
      - run: python -m scripts.desktop_windows_reference
      - run: python -m mypy oscar scripts/desktop_reference.py scripts/desktop_windows_reference.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-reference
          path: .oscar/desktop/
