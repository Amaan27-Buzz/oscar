name: Desktop Tauri and Windows reference
on:
  pull_request:
  push:
    branches: [main, work]
permissions:
  contents: read
jobs:
  windows-reference:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev,mobile]'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: '1.99.0'
          components: rustfmt, clippy
      - run: python -m scripts.build_desktop --checks
      - run: python -m scripts.desktop_baseline --lifecycle-only
      - run: python -m scripts.desktop_tauri --self-check
      - run: python -m unittest tests.test_desktop -v
      - run: python -m scripts.desktop_reference --self-check
      - run: python -m scripts.desktop_windows_reference
      - name: Actual separate Windows Core and scoped Worker over trusted local TLS
        run: python -m scripts.verify_connected_grid
      - name: Actual native CNG and DPAPI Grid enrollment, approval and Worker
        run: python -m scripts.verify_desktop_grid
      - run: python -m mypy oscar scripts/desktop_reference.py scripts/desktop_windows_reference.py scripts/desktop_tauri.py scripts/build_desktop.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-windows-reference
          path: .oscar/desktop/
