name: Sunday software foundation
on:
  pull_request:
  push:
    branches: [main, work]
permissions:
  contents: read
jobs:
  core-boundary:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install '.[dev,sunday]'
      - run: python -m unittest tests.test_sunday -v
      - run: python -m scripts.sunday_reference
      - run: python -m mypy oscar scripts/build_sunday.py scripts/sunday_reference.py
  android-reference-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: python -m scripts.build_sunday
      - uses: actions/upload-artifact@v4
        with:
          name: sunday-reference-apk
          path: .tmp/sunday-sdk-*/oscar-sunday-reference.apk
