name: Expression lab checks

on:
  pull_request:
    paths:
      - 'design/expression-lab/**'
      - 'expression/**'
      - 'mobile/expression/**'
      - 'assets/brand/oscar-orb.svg'
      - '.github/workflows/expression-lab-checks.yml'

permissions:
  contents: read

jobs:
  synthetic-lab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design/expression-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            expression/package-lock.json
            design/expression-lab/package-lock.json
      - run: npm ci
        working-directory: expression
      - run: npm run build
        working-directory: expression
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python -m py_compile tools/capture.py tools/capture-engine.py
  native-expression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: sh gradlew :expression:testDebugUnitTest :expression:assembleDebug :expression:assembleDebugAndroidTest --no-daemon
        working-directory: mobile
