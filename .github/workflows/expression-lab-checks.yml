name: Expression lab checks

on:
  pull_request:
    paths:
      - 'design/expression-lab/**'
      - 'assets/brand/oscar-orb.svg'
      - '.github/workflows/expression-lab-checks.yml'

permissions:
  contents: read

jobs:
  synthetic-lab:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design/expression-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: design/expression-lab/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python -m py_compile tools/capture.py
