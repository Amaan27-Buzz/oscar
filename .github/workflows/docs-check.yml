name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required repository files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            README.md
            AGENTS.md
            ENGINEERING.md
            DESIGN.md
            TASTE.md
            CONTRIBUTING.md
            CHANGELOG.md
            SECURITY.md
            SUPPORT.md
            .env.example
            docs/PRODUCT.md
            docs/CHIEF-OF-STAFF.md
            docs/ARCHITECTURE.md
            docs/EPISTEMIC-INTEGRITY.md
            docs/RUNTIME-FOUNDATIONS.md
            docs/NATIVE-INFRASTRUCTURE.md
            docs/CONNECTION-GRID.md
            docs/MODEL-ROUTING.md
            docs/SEARCH-FRESHNESS.md
            docs/BUILD-GATES.md
            docs/FEATURES.md
            docs/ROADMAP.md
            docs/DECISIONS.md
            docs/MEMORY.md
            docs/PERSONAL-POLICY.md
            docs/PERSONA.md
            docs/COMMUNICATION.md
            docs/CONNECTOR-FABRIC.md
            docs/WORKERS.md
            docs/ORCHESTRATION.md
            docs/SURFACES.md
            docs/SUNDAY-DESIGN.md
            docs/VOICE-SENTRY.md
            docs/ONBOARDING.md
            docs/UI-AVATAR.md
            docs/AGENT-CONTEXT.md
            docs/SECURITY.md
            image-prompts/README.md
            image-prompts/web.md
            image-prompts/sunday-mobile.md
            image-prompts/desktop.md
            image-prompts/system-surfaces.md
            assets/brand/oscar-logo.png
            assets/brand/oscar-orb.svg
            assets/brand/README.md
          )

          for file in "${required[@]}"; do
            test -e "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: Reject removed workbench-project references
        shell: bash
        run: |
          set -euo pipefail
          removed_name='kine''table'
          if git grep -ni -I -e "$removed_name" -- .; then
            echo "Removed hardware-workbench project is still referenced in the current repository."
            exit 1
          fi

      - name: Detect whitespace errors
        run: git diff --check HEAD^
        if: github.event_name == 'push'

      - name: Detect whitespace errors in pull request
        run: git diff --check origin/${{ github.base_ref }}...HEAD
        if: github.event_name == 'pull_request'
