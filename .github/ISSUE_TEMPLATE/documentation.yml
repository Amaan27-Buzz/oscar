name: Documentation issue
description: Report missing, stale or conflicting OSCAR documentation
title: "[Docs] "
labels: ["documentation"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is missing or inconsistent?
    validations:
      required: true
  - type: input
    id: files
    attributes:
      label: Affected files
      placeholder: "README.md, docs/ARCHITECTURE.md, ..."
  - type: textarea
    id: expected
    attributes:
      label: Expected correction
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked the current README, ROADMAP and DECISIONS before filing this.
          required: true
